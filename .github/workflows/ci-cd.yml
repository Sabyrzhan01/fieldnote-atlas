name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  test-backend:
    name: Backend & PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python compilation
        run: python -m compileall -q backend server.py scripts

      - name: Run Backend Unit & PostgreSQL Migration Tests
        env:
          TEST_POSTGRES_URL: postgresql://fieldnote:fieldnote@localhost:5432/fieldnote_atlas
        run: python -m unittest discover -s backend/tests -v

      - name: Verify End-to-End SQLite -> PostgreSQL CLI Migration & FastAPI Delivery
        env:
          POSTGRES_URL: postgresql://fieldnote:fieldnote@localhost:5432/fieldnote_atlas
        run: |
          python - <<'PY'
          import os, tempfile, subprocess, sys
          from fastapi.testclient import TestClient
          from backend.app.repository import SQLiteRepository

          with tempfile.TemporaryDirectory() as tmp:
              sqlite_url = f"sqlite:///{tmp}/custom_source.sqlite3"
              src_repo = SQLiteRepository(sqlite_url)
              # 1. Insert custom observation into SQLite source DB
              src_repo.create({
                  "collection_id": "c3",
                  "title": "Steppe windbreak survey",
                  "body": "Three rows of elm trees planted along the railway embankment.",
                  "kind": "Artifact",
                  "place": "Ili Valley",
                  "region": "Almaty Region, KZ",
                  "date": "Nov 02, 2026",
                  "color": "#c6a45a",
                  "tags": ["steppe", "trees", "railway"],
                  "source": "Field survey 11",
                  "starred": True,
                  "x": 61.5,
                  "y": 28.5
              })
              # 2. Run CLI migration script into PostgreSQL 16
              pg_url = os.environ["POSTGRES_URL"]
              subprocess.run(
                  [sys.executable, "scripts/migrate_sqlite_to_postgres.py", "--source", sqlite_url, "--target", pg_url],
                  check=True
              )
              # 3. Boot FastAPI against PostgreSQL 16 and verify via HTTP API
              os.environ["DATABASE_URL"] = pg_url
              from backend.app.main import app
              client = TestClient(app)
              resp = client.get("/api/atlas")
              assert resp.status_code == 200, resp.text
              payload = resp.json()
              obs = next((o for o in payload["observations"] if o["title"] == "Steppe windbreak survey"), None)
              assert obs is not None, "Custom migrated observation missing from PostgreSQL API response"
              assert obs["collection_id"] == "c3"
              assert obs["place"] == "Ili Valley"
              assert obs["tags"] == ["steppe", "trees", "railway"]
              assert obs["starred"] is True
              print("Verified custom SQLite data migrated into PostgreSQL 16 and served by FastAPI /api/atlas!")
          PY

  test-frontend:
    name: Frontend Unit & Syntax Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check services.js

      - name: Run Frontend Service Unit Tests
        run: node --test frontend/tests/services.test.js

  test-e2e:
    name: Playwright End-to-End Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install playwright pytest pytest-playwright pytest-asyncio httpx
          playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite against PostgreSQL 16
        env:
          FIELDNOTE_DB_URL: postgresql://fieldnote:fieldnote@localhost:5432/fieldnote_atlas
        run: pytest tests/e2e -v

      - name: Upload Test Report Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  test-docker-compose:
    name: Docker Compose Stack Integration Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Docker Compose Stack (Web + PostgreSQL 16)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/api/health; then
              echo "Docker Compose stack is healthy!"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8091/api/health | grep '"ok"'
          curl -fsS http://127.0.0.1:8091/api/atlas | grep '"A city measured in puddles"'
          curl -fsS -X POST http://127.0.0.1:8091/api/observations \
            -H "Content-Type: application/json" \
            -d '{"collection_id":"c1","title":"Compose Smoke Note","body":"Verified inside Docker Compose stack","kind":"Field note","place":"Almaty","region":"KZ","date":"Today","color":"#d87551","tags":["compose"],"source":"CI","starred":false,"x":50,"y":50}' \
            | grep '"Compose Smoke Note"'

      - name: Tear Down Docker Compose Stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Continuous Deployment (GHCR + GitHub Pages Live Redeploy)
    needs: [test-backend, test-frontend, test-e2e, test-docker-compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Container Image to GHCR
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Assemble Static Web Bundle for Live GitHub Pages Deployment
        run: |
          mkdir -p _site
          cp index.html app.js services.js style.css openapi.yaml _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy Live Application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Optional Render / Railway Webhook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated re-deployment webhook..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Print Live Deployment Summary
        run: |
          echo "Live Web Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Published Container Image: ghcr.io/sabyrzhan01/fieldnote-atlas:${{ github.sha }}"
