name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Unit Tests & Build (Vitest + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache frontend npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies, run Vitest unit tests, and build SPA
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

  backend-test:
    name: Backend Unit Tests & Alembic Migrations (Pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote -d fieldnote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations and seed script on PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
        run: |
          alembic upgrade head
          python -m scripts.seed_db

      - name: Run Backend & Repository Pytest Suite against PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
          TEST_POSTGRES_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
        run: |
          pytest backend/tests/test_repository.py -v

  integration:
    name: API & Database Integration Tests (FastAPI + PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote -d fieldnote_int"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify full API lifecycle with PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_int
          ENABLE_TEST_RESET: "1"
        run: |
          alembic upgrade head
          python -m scripts.seed_db
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/atlas | grep -q '"collections"'
          curl -fsS -X POST http://127.0.0.1:8000/api/test/reset | grep -q '"observations"'
          kill $SERVER_PID || true

  e2e:
    name: Playwright End-to-End Tests (Docker Compose Stack)
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache root npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-npm-

      - name: Install Playwright & Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start Docker Compose test stack (app + postgres:16)
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "Stack is healthy!"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Run Playwright E2E Spec Suite (Issues #54–#64)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: |
          npx playwright test

      - name: Upload Playwright HTML Report & Traces Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down Docker Compose test stack
        if: always()
        run: |
          docker compose -f docker-compose.test.yml logs app || true
          docker compose -f docker-compose.test.yml down -v

  docker-build:
    name: Multi-Stage Docker Build & Healthcheck Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage Docker image with BuildKit cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: fieldnote-atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container non-root user, SPA serving, and /api/health
        run: |
          docker run -d --name fieldnote-smoke -p 8000:8000 fieldnote-atlas:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q "Fieldnote Atlas"
          WHOAMI=$(docker exec fieldnote-smoke whoami)
          echo "Container user: $WHOAMI"
          test "$WHOAMI" = "appuser"
          docker rm -f fieldnote-smoke

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration, e2e, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          docker build -t "$image" .
          docker run -d --name candidate -p 8000:8000 "$image"
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8000/api/health
          docker push "$image"
          docker inspect --format 'image={{index .RepoDigests 0}}' "$image" >> "$GITHUB_OUTPUT"

  development:
    needs: publish
    runs-on: [self-hosted, atlas-deploy]
    environment: development
    permissions:
      contents: read
      packages: read
    concurrency:
      group: atlas-development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: ./deploy/release.sh development "$IMAGE"

  compose-drill:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ATLAS_DEPLOY_HOME: /tmp/atlas-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build one test image and start independent environments
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ATLAS_DEPLOY_HOME"/{development,production}
          openssl rand -hex 32 > "$ATLAS_DEPLOY_HOME/alert-token"
          chmod 0444 "$ATLAS_DEPLOY_HOME/alert-token"
          printf 'ALERT_TOKEN_FILE=%s/alert-token\nGRAFANA_ADMIN_PASSWORD=%s\n' "$ATLAS_DEPLOY_HOME" "$(openssl rand -hex 32)" > "$ATLAS_DEPLOY_HOME/monitoring.env"
          docker network create atlas-monitoring
          docker run -d --name atlas-test-registry -p 127.0.0.1:5000:5000 registry:2
          docker build -t localhost:5000/fieldnote-atlas:ci .
          docker push localhost:5000/fieldnote-atlas:ci
          export APP_IMAGE
          APP_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/fieldnote-atlas:ci)
          export APP_VERSION="${APP_IMAGE##*@}"
          docker compose -p atlas-monitoring --env-file "$ATLAS_DEPLOY_HOME/monitoring.env" -f observability/compose.yml up -d --build
          for APP_ENV in development production; do
            export APP_ENV
            port=8000
            if [[ "$APP_ENV" == production ]]; then port=8001; fi
            state="$ATLAS_DEPLOY_HOME/$APP_ENV"
            printf 'APP_PORT=%s\nDB_PASSWORD=%s\n' "$port" "$(openssl rand -hex 32)" > "$state/host.env"
            printf '%s\n' "$APP_IMAGE" > "$state/current"
            docker compose -p "atlas-$APP_ENV" --env-file "$state/host.env" -f deploy/compose.yml up -d --wait --wait-timeout 150
          done
      - name: Check application isolation, dashboard and alert recovery
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/api/version | jq -e '.environment == "development"'
          curl -fsS http://127.0.0.1:8001/api/version | jq -e '.environment == "production"'
          curl -fsS -H 'Content-Type: application/json' -d '{"id":"ci-isolation","title":"CI note","body":"Synthetic","kind":"Field note","place":"Lab","region":"Lab","date":"2026-01-01","color":"blue","source":"CI"}' http://127.0.0.1:8000/api/observations >/dev/null
          curl -fsS http://127.0.0.1:8001/api/atlas | jq -e 'all(.observations[]; .id != "ci-isolation")'
          password=$(sed -n 's/^GRAFANA_ADMIN_PASSWORD=//p' "$ATLAS_DEPLOY_HOME/monitoring.env")
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors -u "admin:$password" http://127.0.0.1:3000/api/dashboards/uid/fieldnote-atlas | jq -e '.dashboard.panels | length == 8'
          python3 deploy/drill.py
          docker compose -p atlas-monitoring --env-file "$ATLAS_DEPLOY_HOME/monitoring.env" -f observability/compose.yml exec -T oncall python - <<'PY'
          import json, sqlite3
          with sqlite3.connect("file:/incidents/reports.db?mode=ro", uri=True) as db:
              reports = [json.loads(row[0]) for row in db.execute("SELECT report FROM incidents")]
          firing = {r["alert"]["labels"]["alertname"] for r in reports
                    if r["alert"]["status"] == "firing"
                    and r["alert"]["labels"]["deployment_environment_name"] == "development"}
          assert {"AtlasHighErrorRate", "AtlasHighLatency", "AtlasUnavailable", "AtlasObservationFailures"} <= firing, firing
          print("Verified persisted Alertmanager webhook delivery for four development alerts")
          PY
      - name: Print observability service diagnostics
        if: failure()
        run: docker compose -p atlas-monitoring --env-file "$ATLAS_DEPLOY_HOME/monitoring.env" -f observability/compose.yml logs --tail=100
