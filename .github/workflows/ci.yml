name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  frontend-test:
    name: Frontend Unit Tests & Build (Vitest + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache frontend npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install dependencies, run Vitest unit tests, and build SPA
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

  backend-test:
    name: Backend Unit Tests & Alembic Migrations (Pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote -d fieldnote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations and seed script on PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
        run: |
          alembic upgrade head
          python -m scripts.seed_db

      - name: Run Backend & Repository Pytest Suite against PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
          TEST_POSTGRES_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_test
        run: |
          pytest backend/tests/test_repository.py -v

  integration:
    name: API & Database Integration Tests (FastAPI + PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldnote
          POSTGRES_PASSWORD: fieldnote
          POSTGRES_DB: fieldnote_int
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldnote -d fieldnote_int"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify full API lifecycle with PostgreSQL 16
        env:
          DATABASE_URL: postgresql+psycopg://fieldnote:fieldnote@localhost:5432/fieldnote_int
          ENABLE_TEST_RESET: "1"
        run: |
          alembic upgrade head
          python -m scripts.seed_db
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/atlas | grep -q '"collections"'
          curl -fsS -X POST http://127.0.0.1:8000/api/test/reset | grep -q '"observations"'
          kill $SERVER_PID || true

  e2e:
    name: Playwright End-to-End Tests (Docker Compose Stack)
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache root npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-npm-

      - name: Install Playwright & Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start Docker Compose test stack (app + postgres:16)
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "Stack is healthy!"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Run Playwright E2E Spec Suite (Issues #54–#64)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: |
          npx playwright test

      - name: Upload Playwright HTML Report & Traces Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down Docker Compose test stack
        if: always()
        run: |
          docker compose -f docker-compose.test.yml logs app || true
          docker compose -f docker-compose.test.yml down -v

  docker-build:
    name: Multi-Stage Docker Build & Healthcheck Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage Docker image with BuildKit cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: fieldnote-atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container non-root user, SPA serving, and /api/health
        run: |
          docker run -d --name fieldnote-smoke -p 8000:8000 fieldnote-atlas:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q "Fieldnote Atlas"
          WHOAMI=$(docker exec fieldnote-smoke whoami)
          echo "Container user: $WHOAMI"
          test "$WHOAMI" = "appuser"
          docker rm -f fieldnote-smoke
