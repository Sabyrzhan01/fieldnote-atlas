services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    volumes: ["./collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    volumes: ["./blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
  loki:
    image: grafana/loki:3.5.1
    volumes:
      - ./loki.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
  tempo:
    image: grafana/tempo:2.7.2
    user: "0:0"
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_TOKEN_FILE:?set absolute ALERT_TOKEN_FILE}:/run/secrets/atlas-alert-token:ro
      - alert-data:/alertmanager
  oncall:
    build:
      context: ../on-call-engineer
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - ${ALERT_TOKEN_FILE:?set absolute ALERT_TOKEN_FILE}:/run/secrets/atlas-alert-token:ro
      - incidents:/incidents
volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alert-data:
  incidents:
networks:
  default:
    name: atlas-monitoring
    external: true
