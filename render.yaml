services:
  - type: web
    name: fieldnote-atlas
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8091
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: fieldnote-atlas-db
          property: connectionString

databases:
  - name: fieldnote-atlas-db
    databaseName: fieldnote_atlas
    user: fieldnote
    plan: free
    region: oregon
