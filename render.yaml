services:
  - type: web
    name: fieldnote-atlas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: fieldnote-atlas-db
          property: connectionString

databases:
  - name: fieldnote-atlas-db
    plan: free
    databaseName: fieldnote_atlas
    user: fieldnote
