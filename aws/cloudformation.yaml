AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fieldnote Atlas - AWS deployment sized for Free Tier / Free Account credit limits.
  Deploys Docker Compose stack (FastAPI Static Frontend + Backend + PostgreSQL)
  on a single free-tier eligible t2.micro / t3.micro EC2 instance with 20GB gp3 storage.
  Avoids managed paid services (no NAT Gateway, ALB, or RDS) to minimize credit consumption.
  Note: Actual charges depend on AWS account eligibility, active Free Tier status,
  credit balance, and public IPv4 address pricing rules.

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: Free-tier eligible EC2 instance type (750 hours/month free).

  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 Key Pair for SSH access (leave empty if SSH is not needed).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter for latest Amazon Linux 2023 AMI.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  AtlasSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Fieldnote Atlas Free Tier instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Inbound HTTP traffic (proxied to port 8091)
        - IpProtocol: tcp
          FromPort: 8091
          ToPort: 8091
          CidrIp: 0.0.0.0/0
          Description: Direct Fieldnote Atlas port
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Optional SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound traffic for software updates and docker hub images
      Tags:
        - Key: Name
          Value: fieldnote-atlas-sg
        - Key: Project
          Value: FieldnoteAtlas
        - Key: BillingTier
          Value: FreeTierEligible

  AtlasInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      SecurityGroupIds:
        - !GetAtt AtlasSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: false
      Tags:
        - Key: Name
          Value: fieldnote-atlas-production
        - Key: Environment
          Value: FreeTier
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Log UserData execution to console and logfile
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          echo "==== Starting Fieldnote Atlas Free Tier Setup ===="

          # 1. Update OS packages and install git and docker
          dnf update -y
          dnf install -y docker git iptables

          # 2. Enable and start Docker service
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # 3. Install Docker Compose plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose || true

          # 4. Port forward standard HTTP (80) to Fieldnote Atlas port (8091)
          iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8091
          
          # 5. Clone repository and start application stack
          mkdir -p /opt/fieldnote-atlas
          cd /opt/fieldnote-atlas
          git clone https://github.com/Sabyrzhan01/fieldnote-atlas.git .

          # 6. Launch Docker Compose stack
          docker compose up -d --build

          echo "==== Fieldnote Atlas Deployed Successfully ===="

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref AtlasInstance

  PublicIP:
    Description: Public IP Address of Fieldnote Atlas
    Value: !GetAtt AtlasInstance.PublicIp

  ApplicationUrl:
    Description: Live Fieldnote Atlas URL (HTTP port 80 / 8091)
    Value: !Sub "http://${AtlasInstance.PublicIp}:8091"

  FreeTierComplianceNotice:
    Description: AWS Free Tier and billing eligibility note
    Value: "Uses 1x t2/t3.micro and 20GB gp3 EBS. Charges may apply beyond Free Tier limits/credits or for public IPv4 addresses depending on account plan; delete stack when not in use."
